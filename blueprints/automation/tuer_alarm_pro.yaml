blueprint:
  name: "🚪 Tür offen – Alarm Pro v5 (Heizungs-Wächter)"
  description: >
    🏠 Tür-Alarm mit TTS & Push – meldet nur, wenn im Raum der Tür die Heizung wirklich heizt.
    🔥 v5: Heizungs-Thermostate einmal für das ganze Haus wählen. Zu einer Tür gehören die
    gewählten Thermostate im selben Bereich. Türen in Räumen ohne Heizung bleiben still.
    "Heizt" heißt: hvac_action = heating (Ventil offen). Thermostate ohne hvac_action
    (z. B. Wandthermostate, Gruppen) gelten als heizend, wenn sie an sind und Soll > Ist.
    ⏻ Optional: Thermostat nach X Alarmrunden ODER Y Minuten (was zuerst kommt) ausschalten.
    Sind alle Türen des Raums wieder zu, wird der ursprüngliche Modus samt Solltemperatur
    wiederhergestellt (Szenen-Snapshot, optional neustartsicher über einen input_text-Helfer).
    ✅ Danke-Ansage nur nach echtem Alarm (Merker statt Öffnungsdauer).
    🗣️ Neu: moderne Sprachausgabe über tts.speak (TTS-Entität), alter TTS-Dienst bleibt möglich.
    🔇 TTS & Push getrennt steuerbar mit eigenen Schlafzeiten.
    🔋 Batterie-Warnung: sensor.* (%) UND binary_sensor.* (LOWBAT) – mehrere Entities möglich.
    🔁 Wiederholungsansagen mit Custom Actions.
    Ohne gewählte Thermostate verhält sich das Blueprint wie v4 (jede Tür meldet).
    Alle Input-IDs aus v4 bleiben erhalten. Home Assistant 2026.7 oder neuer.
  domain: automation
  author: "magicx78"
  source_url: https://github.com/magicx78/ha-blueprints/blob/main/blueprints/automation/tuer_alarm_pro.yaml
  homeassistant:
    min_version: "2026.7.0"

  input:

    # ════════════════════════════════════════════════════════
    # SEKTION 1: 🚪 Tür & Timing
    # ════════════════════════════════════════════════════════
    section_trigger:
      name: "🚪 Tür & Timing"
      icon: mdi:door-open
      input:
        door_entity:
          name: "🚪 Tür-Sensor(en)"
          description: >
            Tür- oder Fenster-Binärsensoren mit passender Geräteklasse – für das ganze Haus.
            Damit die Heizungsprüfung greift, muss jeder Sensor (oder sein Gerät) einem Bereich
            zugeordnet sein.
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: door
                - domain: binary_sensor
                  device_class: window
              multiple: true

        initial_delay:
          name: "⏱️ Wartezeit bis erste Ansage (Sekunden)"
          description: >
            So lange muss die Tür offen sein, während im Raum geheizt wird, bevor der Alarm
            auslöst. Springt die Heizung erst später an, beginnt die Wartezeit dann.
          default: 60
          selector:
            number:
              min: 10
              max: 3600
              unit_of_measurement: "Sek"
              mode: box

        trigger_debounce_seconds:
          name: "🧯 Entprellzeit (Sekunden)"
          description: "Tür muss so lange stabil on/off sein, bevor ausgelöst wird (2–5 Sek empfohlen)."
          default: 1
          selector:
            number:
              min: 1
              max: 10
              unit_of_measurement: "Sek"
              mode: slider

    # ════════════════════════════════════════════════════════
    # SEKTION 2: 🔥 Heizung
    # ════════════════════════════════════════════════════════
    section_heating:
      name: "🔥 Heizung"
      icon: mdi:radiator
      input:
        heating_thermostats:
          name: "🌡️ Heizungs-Thermostate"
          description: >
            Alle Heizkörper-Thermostate, die überwacht werden sollen – für das ganze Haus.
            Zu einer Tür gehören die hier gewählten Thermostate im selben Bereich wie die Tür.
            Nur echte Heizungen wählen, keine Klimaanlagen. Am besten die einzelnen Ventile
            wählen, die melden, ob gerade geheizt wird (hvac_action), statt Gruppen.
            Leer lassen = Verhalten wie v4: jede Tür meldet, ohne Heizungsprüfung.
          default: []
          selector:
            entity:
              filter:
                domain: climate
              multiple: true

        doors_without_heating:
          name: "🚪 Türen ohne Thermostat im Raum"
          description: >
            Was passiert bei Türen, in deren Bereich keines der gewählten Thermostate liegt?
            Wirkt nur, wenn oben Thermostate gewählt sind.
          default: "ignore"
          selector:
            select:
              options:
                - label: "🔕 Ignorieren (keine Ansage)"
                  value: "ignore"
                - label: "🔔 Immer melden (wie v4)"
                  value: "always"

        heating_off_enabled:
          name: "⏻ Heizung bei offener Tür ausschalten"
          description: >
            Schaltet die Thermostate des Raums aus (hvac_mode off), wenn eines der beiden
            Kriterien unten erreicht ist. Danach kommt eine Ansage, dann Ruhe. Sind alle Türen
            des Raums wieder zu, wird der vorherige Zustand wiederhergestellt.
          default: false
          selector:
            boolean: {}

        heating_off_after_count:
          name: "🔢 Ausschalten nach Anzahl Alarmrunden"
          description: >
            Erste Ansage + Wiederholungen. Runden in der Schlafzeit zählen mit, damit nachts
            trotzdem abgeschaltet wird. 0 = Kriterium aus.
          default: 3
          selector:
            number:
              min: 0
              max: 20
              mode: box

        heating_off_after_minutes:
          name: "⏲️ Ausschalten nach Minuten (ab erster Ansage)"
          description: "0 = Kriterium aus. Es gilt, was zuerst eintritt."
          default: 15
          selector:
            number:
              min: 0
              max: 240
              unit_of_measurement: "Min"
              mode: box

        heating_state_helper:
          name: "💾 Merker-Helfer (optional, neustartsicher)"
          description: >
            Ohne Helfer wird der vorherige Zustand als Szene gemerkt – die geht bei einem
            HA-Neustart verloren. Mit einem Text-Helfer (input_text, max. 255 Zeichen) übersteht
            die Wiederherstellung auch einen Neustart. Den Helfer nur für dieses Blueprint nutzen.
          default: ""
          selector:
            entity:
              filter:
                domain: input_text

        notify_heating:
          name: "📲 Push bei Heizung aus / wieder an"
          description: "Nutzt die Push-Einstellungen aus der Sektion 'Push-Benachrichtigung'."
          default: true
          selector:
            boolean: {}

        message_heating_off:
          name: "💬 Ansage: Heizung ausgeschaltet"
          description: "Platzhalter: {trigger_name}, {room_name}"
          default: "Die Heizung im Raum {room_name} wurde ausgeschaltet, weil die {trigger_name} offen ist."
          selector:
            text:
              multiline: true

        message_heating_restored:
          name: "💬 Ansage: Heizung wieder an"
          description: "Platzhalter: {trigger_name}, {room_name}"
          default: "Danke! Die {trigger_name} ist zu. Die Heizung im Raum {room_name} läuft wieder."
          selector:
            text:
              multiline: true

    # ════════════════════════════════════════════════════════
    # SEKTION 3: 🔊 Sprachausgabe (TTS)
    # ════════════════════════════════════════════════════════
    section_tts:
      name: "🔊 Sprachausgabe (TTS)"
      icon: mdi:speaker-message
      input:
        tts_enabled:
          name: "🔊 Sprachausgabe aktivieren"
          default: true
          selector:
            boolean: {}

        media_player_entity:
          name: "🔈 Lautsprecher"
          description: "Einen oder mehrere Media Player für die TTS-Ausgabe"
          selector:
            entity:
              filter:
                domain: media_player
              multiple: true

        tts_entity:
          name: "🗣️ TTS-Entität (empfohlen)"
          description: >
            Moderne Sprachausgabe über tts.speak, z. B. tts.home_assistant_cloud oder tts.piper.
            Wenn gesetzt, wird der 'TTS Service' darunter ignoriert.
          default: ""
          selector:
            entity:
              filter:
                domain: tts

        tts_service:
          name: "⚙️ TTS Service (alt)"
          description: "Nur ohne TTS-Entität: z.B. tts.cloud_say (Nabu Casa) oder tts.google_translate_say"
          default: "tts.cloud_say"
          selector:
            select:
              options:
                - "tts.cloud_say"
                - "tts.google_translate_say"
                - "tts.openai_tts"
              custom_value: true

        tts_language:
          name: "🌍 Sprache (optional)"
          description: "z.B. 'de-DE' – leer lassen für Standardsprache des TTS-Dienstes"
          default: ""
          selector:
            text: {}

        message_first:
          name: "💬 Erste Ansage"
          description: "Platzhalter: {trigger_name}, {room_name}"
          default: "Achtung! Die {trigger_name} ist offen."
          selector:
            text:
              multiline: true

        message_repeat:
          name: "🔁 Wiederholungs-Ansage"
          description: "Platzhalter: {trigger_name}, {room_name}, {open_minutes}"
          default: "Achtung! {trigger_name} ist seit {open_minutes} Minuten offen! Bitte schließen!"
          selector:
            text:
              multiline: true

        message_closed:
          name: "🙏 Danke-Ansage (beim Schließen)"
          description: "Platzhalter: {trigger_name}, {room_name}"
          default: "Danke! Die {trigger_name} wurde geschlossen."
          selector:
            text:
              multiline: true

        thank_you_mode:
          name: "🙏 Wann soll die Danke-Ansage kommen?"
          description: >
            'Immer' = bei jedem Schließen der Tür (auch wenn kein Alarm ausgelöst wurde).
            'Nur nach Alarm' = nur wenn vorher wirklich eine Alarmrunde lief.
            Wurde die Heizung ausgeschaltet, kommt statt dessen die Ansage 'Heizung wieder an'.
          default: "nur_nach_alarm"
          selector:
            select:
              options:
                - label: "🔔 Immer beim Schließen"
                  value: "immer"
                - label: "🚨 Nur nach Alarm-Trigger"
                  value: "nur_nach_alarm"

        # TTS Schlafzeit – getrennt von Push
        tts_sleep_start:
          name: "😴 TTS Schlafzeit Beginn (optional)"
          description: "In dieser Zeit wird KEINE Sprachausgabe gemacht. Format: HH:MM:SS. '00:00:00' = deaktiviert."
          default: "00:00:00"
          selector:
            time: {}

        tts_sleep_end:
          name: "☀️ TTS Schlafzeit Ende (optional)"
          description: "Format: HH:MM:SS – Mitternacht-übergreifend wird korrekt erkannt. '00:00:00' = deaktiviert."
          default: "00:00:00"
          selector:
            time: {}

    # ════════════════════════════════════════════════════════
    # SEKTION 4: 🔔 Chime
    # ════════════════════════════════════════════════════════
    section_chime:
      name: "🔔 Chime (Ton vor Ansage)"
      icon: mdi:bell-ring
      collapsed: true
      input:
        chime_url:
          name: "🔔 Chime URL"
          description: >
            URL zur Audiodatei, die VOR der ersten TTS-Ansage abgespielt wird.
            Beispiel (eigene Datei in HA): http://192.168.1.100:8123/local/chime.mp3
            Leer lassen = kein Chime.
          default: ""
          selector:
            text: {}

        chime_media_content_type:
          name: "📄 Content Type"
          description: "MIME-Typ der Audiodatei"
          default: "audio/mp3"
          selector:
            select:
              options:
                - "audio/mp3"
                - "audio/wav"
                - "audio/ogg"
              custom_value: true

        chime_wait_seconds:
          name: "⏳ Wartezeit nach Chime (Sekunden)"
          description: "Pause zwischen Chime und erster TTS-Ansage"
          default: 2
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "Sek"

    # ════════════════════════════════════════════════════════
    # SEKTION 5: 🔁 Wiederholung
    # ════════════════════════════════════════════════════════
    section_repeat:
      name: "🔁 Wiederholung"
      icon: mdi:repeat
      input:
        repeat_enabled:
          name: "🔁 Wiederholung aktivieren"
          description: >
            Aus = nur die erste Ansage. Die Alarmrunden laufen trotzdem still weiter, damit das
            Ausschalten der Heizung nach Anzahl Runden funktioniert.
          default: true
          selector:
            boolean: {}

        repeat_interval:
          name: "⏱️ Wiederholungsintervall (Sekunden)"
          default: 60
          selector:
            number:
              min: 10
              max: 600
              unit_of_measurement: "Sek"
              mode: box

    # ════════════════════════════════════════════════════════
    # SEKTION 6: 📲 Push-Benachrichtigung
    # ════════════════════════════════════════════════════════
    section_notify:
      name: "📲 Push-Benachrichtigung (optional)"
      icon: mdi:cellphone-bell
      collapsed: true
      input:
        notify_enabled:
          name: "📲 Push-Benachrichtigung aktivieren"
          default: false
          selector:
            boolean: {}

        notify_services:
          name: "📱 Notify Services"
          description: "Kommagetrennte Liste z.B.: notify.mobile_app_iphone,notify.mobile_app_pixel"
          default: ""
          selector:
            text: {}

        notify_title:
          name: "📌 Push-Titel"
          description: "Platzhalter: {trigger_name}, {room_name}"
          default: "🚪 Tür offen: {trigger_name}"
          selector:
            text: {}

        notify_message:
          name: "💬 Push-Nachricht"
          description: "Platzhalter: {trigger_name}, {room_name}, {open_minutes}"
          default: "Die {trigger_name} steht seit {open_minutes} Minuten offen!"
          selector:
            text:
              multiline: true

        notify_interruption_level:
          name: "🔔 iOS Interruption Level"
          default: "active"
          selector:
            select:
              options:
                - label: "🔔 active (Standard)"
                  value: "active"
                - label: "⏰ time-sensitive (Dringlich)"
                  value: "time-sensitive"
                - label: "🚨 critical (Immer, auch DND)"
                  value: "critical"
                - label: "🔕 passive (Lautlos)"
                  value: "passive"

        # Push Schlafzeit – getrennt von TTS
        push_sleep_start:
          name: "😴 Push Schlafzeit Beginn (optional)"
          description: "In dieser Zeit werden KEINE Push-Nachrichten gesendet. '00:00:00' = deaktiviert."
          default: "00:00:00"
          selector:
            time: {}

        push_sleep_end:
          name: "☀️ Push Schlafzeit Ende (optional)"
          description: "Format: HH:MM:SS – Mitternacht-übergreifend wird korrekt erkannt. '00:00:00' = deaktiviert."
          default: "00:00:00"
          selector:
            time: {}

    # ════════════════════════════════════════════════════════
    # SEKTION 7: 🔋 Batterie-Warnung
    # ════════════════════════════════════════════════════════
    section_battery:
      name: "🔋 Batterie-Warnung (optional)"
      icon: mdi:battery-alert
      collapsed: true
      input:
        battery_warn_enabled:
          name: "🔋 Batterie-Warnung aktivieren"
          default: false
          selector:
            boolean: {}

        battery_sensor:
          name: "🔋 Batterie-Entity(s) des Tür-Sensors"
          description: >
            Mehrere Entities möglich!
            📊 sensor.* mit Prozentwert (z.B. sensor.tuer_battery = 45%)
            🔴 binary_sensor.* mit LOWBAT on/off (z.B. binary_sensor.lager_tuer_batterie)
            Bei binary_sensor gilt: on = Batterie leer.
            Leer lassen um Batterie-Warnung zu deaktivieren.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
                - domain: binary_sensor
                  device_class: battery
              multiple: true

        battery_threshold:
          name: "⚡ Batterie-Schwellwert (%) – nur für sensor.*"
          description: >
            Warnung wenn Prozentwert UNTER diesen Wert fällt.
            Wird bei binary_sensor (LOWBAT) ignoriert.
          default: 20
          selector:
            number:
              min: 5
              max: 50
              unit_of_measurement: "%"
              mode: slider

        battery_notify_push:
          name: "📲 Batterie-Warnung per Push"
          default: true
          selector:
            boolean: {}

        battery_notify_tts:
          name: "🔊 Batterie-Warnung per Sprachausgabe"
          default: false
          selector:
            boolean: {}

        battery_notify_title:
          name: "📌 Batterie Push-Titel"
          description: "Platzhalter: {trigger_name}, {battery_level}"
          default: "🔋 Batterie-Warnung: {trigger_name}"
          selector:
            text: {}

        battery_notify_message:
          name: "💬 Batterie Push-Nachricht"
          description: "Platzhalter: {trigger_name}, {battery_level}"
          default: "⚠️ Der Akku von {trigger_name} ist nur noch bei {battery_level}! Bitte bald wechseln."
          selector:
            text:
              multiline: true

        battery_tts_message:
          name: "🔊 Batterie TTS-Ansage"
          description: "Platzhalter: {trigger_name}, {battery_level}"
          default: "Achtung! Der Akku des Sensors {trigger_name} ist schwach. Stand: {battery_level}."
          selector:
            text:
              multiline: true

        battery_interruption_level:
          name: "🔔 iOS Interruption Level für Batterie"
          default: "active"
          selector:
            select:
              options:
                - label: "🔔 active"
                  value: "active"
                - label: "⏰ time-sensitive"
                  value: "time-sensitive"
                - label: "🚨 critical"
                  value: "critical"
                - label: "🔕 passive"
                  value: "passive"

    # ════════════════════════════════════════════════════════
    # SEKTION 8: ⚙️ Bypass & Deaktivierung
    # ════════════════════════════════════════════════════════
    section_control:
      name: "⚙️ Bypass & Deaktivierung"
      icon: mdi:shield-off
      collapsed: true
      input:
        disable_switch:
          name: "🔴 Deaktivierungs-Schalter (optional)"
          description: >
            input_boolean – wenn 'on', gibt es keine Alarme und keine Abschaltung.
            Das Wiederherstellen der Heizung läuft trotzdem.
          default: ""
          selector:
            entity:
              filter:
                domain: input_boolean

        bypass_entities:
          name: "🛡️ Bypass-Entities (optional)"
          description: >
            Wenn eine dieser Entities 'on' ist, wird kein Alarm ausgelöst (z.B. Anwesenheit, Urlaub).
            Das Wiederherstellen der Heizung läuft trotzdem.
          default: []
          selector:
            entity:
              multiple: true

    # ════════════════════════════════════════════════════════
    # SEKTION 9: 🎬 Custom Actions
    # ════════════════════════════════════════════════════════
    section_custom_actions:
      name: "🎬 Custom Actions (optional)"
      icon: mdi:script-text
      collapsed: true
      input:
        action_on_open:
          name: "🚪 Aktion beim Öffnen (nach erster Ansage)"
          default: []
          selector:
            action: {}

        action_on_close:
          name: "🚪 Aktion beim Schließen"
          default: []
          selector:
            action: {}

# ════════════════════════════════════════════════════════════════════════════════
# AUTOMATION ENGINE
# ════════════════════════════════════════════════════════════════════════════════
#
# Ein Lauf je Türöffnung (mode: parallel). Der Öffnungs-Lauf wartet, bis im Raum
# geheizt wird, alarmiert und schaltet ggf. ab. Das Schließen startet einen eigenen
# Lauf, der wiederherstellt. Nach einem HA-Neustart feuert die Automation für jede
# Tür das Event tuer_alarm_pro_resume an sich selbst, damit offene Türen wieder
# überwacht und geschlossene Räume wiederhergestellt werden.

mode: parallel
max: 50
max_exceeded: silent

variables:
  v_door_input: !input door_entity
  v_door_list: "{{ [v_door_input] if v_door_input is string else v_door_input }}"
  v_initial_delay: !input initial_delay
  v_debounce: !input trigger_debounce_seconds
  v_thermostats: !input heating_thermostats
  v_thermostat_list: "{{ [v_thermostats] if v_thermostats is string else v_thermostats }}"
  v_doors_without_heating: !input doors_without_heating
  v_heat_off_enabled: !input heating_off_enabled
  v_heat_off_count: !input heating_off_after_count
  v_heat_off_minutes: !input heating_off_after_minutes
  v_state_helper: !input heating_state_helper
  v_notify_heating: !input notify_heating
  v_msg_heating_off: !input message_heating_off
  v_msg_heating_restored: !input message_heating_restored
  v_tts_enabled: !input tts_enabled
  v_media_players: !input media_player_entity
  v_tts_entity: !input tts_entity
  v_tts_service: !input tts_service
  v_tts_language: !input tts_language
  # tts.speak (TTS-Entität) oder alter say-Dienst; die Daten werden als Dict
  # gebaut, damit language nur gesendet wird, wenn sie gesetzt ist.
  v_tts_action: "{{ 'tts.speak' if v_tts_entity not in ['', none] else v_tts_service }}"
  v_tts_base: >-
    {%- set d = {'cache': false} -%}
    {%- if v_tts_entity not in ['', none] -%}
      {%- set d = dict(d, entity_id=v_tts_entity, media_player_entity_id=v_media_players) -%}
    {%- else -%}
      {%- set d = dict(d, entity_id=v_media_players) -%}
    {%- endif -%}
    {%- if v_tts_language not in ['', none] -%}
      {%- set d = dict(d, language=v_tts_language) -%}
    {%- endif -%}
    {{ d }}
  v_msg_first: !input message_first
  v_msg_repeat: !input message_repeat
  v_msg_closed: !input message_closed
  v_thank_you_mode: !input thank_you_mode
  v_tts_sleep_start: !input tts_sleep_start
  v_tts_sleep_end: !input tts_sleep_end
  v_tts_sleep_disabled: >-
    {{ v_tts_sleep_start == '00:00:00'
       or v_tts_sleep_end == '00:00:00'
       or v_tts_sleep_start == v_tts_sleep_end }}
  v_chime_url: !input chime_url
  v_chime_type: !input chime_media_content_type
  v_chime_wait: !input chime_wait_seconds
  v_repeat_enabled: !input repeat_enabled
  v_repeat_interval: !input repeat_interval
  v_notify_enabled: !input notify_enabled
  v_notify_services: !input notify_services
  v_notify_list: "{{ v_notify_services.split(',') | map('trim') | reject('eq', '') | list }}"
  v_notify_title: !input notify_title
  v_notify_message: !input notify_message
  v_notify_level: !input notify_interruption_level
  v_push_sleep_start: !input push_sleep_start
  v_push_sleep_end: !input push_sleep_end
  v_push_sleep_disabled: >-
    {{ v_push_sleep_start == '00:00:00'
       or v_push_sleep_end == '00:00:00'
       or v_push_sleep_start == v_push_sleep_end }}
  v_battery_warn_enabled: !input battery_warn_enabled
  v_battery_sensors: !input battery_sensor
  v_battery_threshold: !input battery_threshold
  v_battery_notify_push: !input battery_notify_push
  v_battery_notify_tts: !input battery_notify_tts
  v_battery_notify_title: !input battery_notify_title
  v_battery_notify_message: !input battery_notify_message
  v_battery_tts_message: !input battery_tts_message
  v_battery_interruption_level: !input battery_interruption_level
  v_disable_switch: !input disable_switch
  v_bypass_entities: !input bypass_entities

# Purpose-specific triggers ignore unavailable/unknown recovery transitions.
triggers:
  - trigger: door.opened
    target:
      entity_id: !input door_entity
    options:
      behavior: each
    id: door_opened

  - trigger: door.closed
    target:
      entity_id: !input door_entity
    options:
      behavior: each
    id: door_closed

  - trigger: window.opened
    target:
      entity_id: !input door_entity
    options:
      behavior: each
    id: door_opened

  - trigger: window.closed
    target:
      entity_id: !input door_entity
    options:
      behavior: each
    id: door_closed

  - trigger: homeassistant
    event: start
    id: ha_start

  - trigger: event
    event_type: tuer_alarm_pro_resume
    id: resume

actions:
  # ── Neustart: jede Tür über ein Event an sich selbst neu einlesen ────────
  # Ein Event je Tür, damit jede Tür wieder ihren eigenen parallelen Lauf
  # bekommt. 60 s Vorlauf, bis Funk-Integrationen ihre Zustände geladen haben.
  - if:
      - condition: trigger
        id: ha_start
    then:
      - delay:
          seconds: 60
      - repeat:
          for_each: "{{ v_door_list }}"
          sequence:
            - event: tuer_alarm_pro_resume
              event_data:
                automation: "{{ this.entity_id }}"
                entity_id: "{{ repeat.item }}"
      - stop: "🔄 Neustart: Türen neu eingelesen"

  - if:
      - condition: trigger
        id: resume
      - condition: template
        value_template: >-
          {{ trigger.event.data.automation != this.entity_id
             or trigger.event.data.entity_id not in v_door_list }}
    then:
      - stop: "Resume-Event einer anderen Automation"

  # ── Laufzeit-Variablen ────────────────────────────────────────────────────
  - variables:
      v_door: >-
        {{ trigger.event.data.entity_id if trigger.id == 'resume' else trigger.entity_id }}
      v_event: >-
        {%- if trigger.id == 'resume' -%}
          {%- if is_state(v_door, 'on') -%}door_opened
          {%- elif is_state(v_door, 'off') -%}door_closed
          {%- else -%}none{%- endif -%}
        {%- else -%}
          {{ trigger.id }}
        {%- endif -%}
      v_trig_name: "{{ state_attr(v_door, 'friendly_name') | default(v_door, true) }}"
      v_area: "{{ area_id(v_door) or '' }}"
      v_room_name: "{{ area_name(v_area) if v_area != '' else v_trig_name }}"
      # area_entities() bewusst inline: als eigene Variable stünde die komplette
      # Entity-Liste des Bereichs in jedem Trace.
      v_room_thermostats: >-
        {{ (v_thermostat_list | select('in', area_entities(v_area)) | list) if v_area != '' else [] }}
      v_room_doors: >-
        {{ (v_door_list | select('in', area_entities(v_area)) | list) if v_area != '' else [v_door] }}
      # legacy = ohne Heizungsprüfung (wie v4), heating = mit Heizungsprüfung,
      # ignore = Tür in einem Raum ohne gewähltes Thermostat
      v_heating_mode: >-
        {%- if v_thermostat_list | count == 0 -%}legacy
        {%- elif v_room_thermostats | count > 0 -%}heating
        {%- elif v_doors_without_heating == 'always' -%}legacy
        {%- else -%}ignore{%- endif -%}

  - if:
      - condition: template
        value_template: "{{ v_event not in ['door_opened', 'door_closed'] }}"
    then:
      - stop: "Türzustand unklar (unavailable/unknown)"

  - if:
      - condition: template
        value_template: "{{ v_heating_mode == 'ignore' }}"
    then:
      - stop: "🔕 Kein Heizungs-Thermostat im Bereich der Tür – ignoriert"

  # Apply debounce after the event so the blueprint's numeric input remains
  # configurable. Cancel stale runs if the entity changed again during the wait.
  - if:
      - condition: template
        value_template: "{{ trigger.id != 'resume' }}"
    then:
      - delay:
          seconds: "{{ v_debounce | int(1) }}"

      - if:
          - condition: template
            value_template: >-
              {{ states(v_door) != trigger.to_state.state
                 or states[v_door].last_changed != trigger.to_state.last_changed }}
        then:
          - stop: "Türzustand während der Entprellzeit geändert"

  - choose:

      # ╔══════════════════════════════════════════════════════════════════════╗
      # ║  PFAD A: Tür geschlossen – Heizung wiederherstellen                  ║
      # ╚══════════════════════════════════════════════════════════════════════╝
      - conditions:
          - condition: template
            value_template: "{{ v_event == 'door_closed' }}"
        sequence:
          # Wiederherstellen nur, wenn alle Türen des Raums wirklich zu sind
          # (unavailable zählt nicht als zu).
          - variables:
              v_room_closed: "{{ v_room_doors | reject('is_state', 'off') | list | count == 0 }}"
              v_helper_raw: "{{ states(v_state_helper) if v_state_helper not in ['', none] else '' }}"
              v_restored: []

          - if:
              - condition: template
                value_template: "{{ v_heating_mode == 'heating' and v_room_closed }}"
            then:
              - repeat:
                  for_each: "{{ v_room_thermostats }}"
                  sequence:
                    - variables:
                        v_th: "{{ repeat.item }}"
                        v_th_key: "{{ repeat.item.split('.', 1)[1] }}"
                        v_th_scene: "scene.tuer_alarm_pro_{{ repeat.item.split('.', 1)[1] }}"
                    - variables:
                        v_th_has_scene: "{{ states[v_th_scene] is not none }}"
                        v_th_entry: >-
                          {{ v_helper_raw.split(';')
                             | select('search', '^' ~ v_th_key ~ '=')
                             | first | default('') }}

                    # Nur zurückstellen, wenn das Thermostat noch aus ist –
                    # eine manuelle Änderung zwischendurch hat Vorrang.
                    - if:
                        - condition: template
                          value_template: "{{ v_th_has_scene }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ is_state(v_th, 'off') }}"
                          then:
                            - action: scene.turn_on
                              target:
                                entity_id: "{{ v_th_scene }}"
                              continue_on_error: true
                            - variables:
                                v_restored: "{{ v_restored + [v_th] }}"
                        - action: scene.delete
                          target:
                            entity_id: "{{ v_th_scene }}"
                          continue_on_error: true
                      else:
                        # Szene nach Neustart weg → Werte aus dem Merker-Helfer
                        - if:
                            - condition: template
                              value_template: "{{ v_th_entry != '' and is_state(v_th, 'off') }}"
                          then:
                            - variables:
                                v_th_mode: "{{ v_th_entry.split('=', 1)[1].split(':')[0] }}"
                                v_th_temp: "{{ (v_th_entry.split('=', 1)[1].split(':') + [''])[1] }}"
                            - if:
                                - condition: template
                                  value_template: "{{ v_th_mode not in ['', 'off'] }}"
                              then:
                                - action: climate.set_hvac_mode
                                  target:
                                    entity_id: "{{ v_th }}"
                                  data:
                                    hvac_mode: "{{ v_th_mode }}"
                                  continue_on_error: true
                                - if:
                                    - condition: template
                                      value_template: "{{ v_th_mode != 'auto' and is_number(v_th_temp) }}"
                                  then:
                                    - action: climate.set_temperature
                                      target:
                                        entity_id: "{{ v_th }}"
                                      data:
                                        temperature: "{{ v_th_temp | float }}"
                                      continue_on_error: true
                                - variables:
                                    v_restored: "{{ v_restored + [v_th] }}"

                    - if:
                        - condition: template
                          value_template: "{{ v_th_entry != '' }}"
                      then:
                        - action: input_text.set_value
                          target:
                            entity_id: "{{ v_state_helper }}"
                          data:
                            value: >-
                              {{ states(v_state_helper).split(';')
                                 | select('search', '=')
                                 | reject('search', '^' ~ v_th_key ~ '=')
                                 | join(';') }}
                          continue_on_error: true

          - if:
              - condition: template
                value_template: "{{ v_restored | count > 0 }}"
            then:
              - variables:
                  v_msg: >-
                    {{ v_msg_heating_restored
                       | replace('{trigger_name}', v_trig_name)
                       | replace('{room_name}', v_room_name) }}

              - if:
                  - condition: template
                    value_template: "{{ v_tts_enabled == true }}"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ v_tts_sleep_disabled }}"
                      - condition: not
                        conditions:
                          - condition: time
                            after: !input tts_sleep_start
                            before: !input tts_sleep_end
                then:
                  - action: "{{ v_tts_action }}"
                    data: "{{ dict(v_tts_base, message=v_msg) }}"
                    continue_on_error: true

              - if:
                  - condition: template
                    value_template: >-
                      {{ v_notify_heating == true and v_notify_enabled == true
                         and v_notify_list | count > 0 }}
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ v_push_sleep_disabled }}"
                      - condition: not
                        conditions:
                          - condition: time
                            after: !input push_sleep_start
                            before: !input push_sleep_end
                then:
                  - repeat:
                      for_each: "{{ v_notify_list }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "🔥 Heizung wieder an: {{ v_room_name }}"
                            message: "{{ v_msg }}"
                            data:
                              push:
                                interruption-level: "{{ v_notify_level }}"
                          continue_on_error: true
            else:
              # Danke-Ansage "immer" kommt aus diesem Lauf. "Nur nach Alarm"
              # übernimmt der Öffnungs-Lauf, weil nur er weiß, ob alarmiert wurde.
              - if:
                  - condition: template
                    value_template: "{{ v_tts_enabled == true and v_thank_you_mode == 'immer' }}"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ v_tts_sleep_disabled }}"
                      - condition: not
                        conditions:
                          - condition: time
                            after: !input tts_sleep_start
                            before: !input tts_sleep_end
                then:
                  - action: "{{ v_tts_action }}"
                    data: >-
                      {{ dict(v_tts_base, message=(v_msg_closed
                                                   | replace('{trigger_name}', v_trig_name)
                                                   | replace('{room_name}', v_room_name))) }}
                    continue_on_error: true

          - choose: []
            default: !input action_on_close

          - stop: "✅ Tür geschlossen"

      # ╔══════════════════════════════════════════════════════════════════════╗
      # ║  PFAD B: Tür geöffnet – warten, alarmieren, ggf. abschalten          ║
      # ╚══════════════════════════════════════════════════════════════════════╝
      - conditions:
          - condition: template
            value_template: "{{ v_event == 'door_opened' }}"
        sequence:

          # ── 1. Deaktivierungs-Schalter & Bypass prüfen ──────────────────
          - if:
              - condition: template
                value_template: >-
                  {{ (v_disable_switch != '' and states(v_disable_switch) == 'on')
                     or (v_bypass_entities | select('is_state', 'on') | list | count > 0) }}
            then:
              - stop: "🛡️ Schalter/Bypass aktiv – kein Alarm"

          - variables:
              v_rounds: 0
              v_alarm_started: 0
              v_alarmed: false
              v_switched_off: false

          # ── 2. Schleife, solange die Tür nicht zu ist ───────────────────
          # Schlägt eine condition fehl, endet nur die aktuelle Runde; die
          # Schleife prüft dann neu. unavailable hält den Lauf am Leben,
          # löst aber nichts aus.
          - repeat:
              while:
                - condition: template
                  value_template: "{{ not is_state(v_door, 'off') }}"
              sequence:
                # 2a. Warten, bis im Raum geheizt wird (oder die Tür zu ist).
                #     Gleicher Heiz-Ausdruck wie in 2c.
                - wait_template: >-
                    {%- set ns = namespace(h=(v_heating_mode == 'legacy')) -%}
                    {%- for t in v_room_thermostats -%}
                      {%- set a = state_attr(t, 'hvac_action') -%}
                      {%- if a == 'heating'
                            or (a is none
                                and states(t) not in ['off', 'unavailable', 'unknown']
                                and state_attr(t, 'temperature') | float(0)
                                    > state_attr(t, 'current_temperature') | float(100)) -%}
                        {%- set ns.h = true -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ (ns.h and is_state(v_door, 'on')) or is_state(v_door, 'off') }}

                - condition: template
                  value_template: "{{ is_state(v_door, 'on') }}"

                # 2b. Wartezeit (erste Runde) bzw. Intervall – Schließen bricht sofort ab
                - wait_template: "{{ not is_state(v_door, 'on') }}"
                  timeout: "{{ (v_initial_delay if v_rounds == 0 else v_repeat_interval) | int(60) }}"
                  continue_on_timeout: true

                - condition: template
                  value_template: "{{ is_state(v_door, 'on') }}"

                # 2c. Wird noch geheizt? Sonst zurück zu 2a.
                - condition: template
                  value_template: >-
                    {%- set ns = namespace(h=(v_heating_mode == 'legacy')) -%}
                    {%- for t in v_room_thermostats -%}
                      {%- set a = state_attr(t, 'hvac_action') -%}
                      {%- if a == 'heating'
                            or (a is none
                                and states(t) not in ['off', 'unavailable', 'unknown']
                                and state_attr(t, 'temperature') | float(0)
                                    > state_attr(t, 'current_temperature') | float(100)) -%}
                        {%- set ns.h = true -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.h }}

                # 2d. Schalter & Bypass erneut prüfen
                - if:
                    - condition: template
                      value_template: >-
                        {{ (v_disable_switch != '' and states(v_disable_switch) == 'on')
                           or (v_bypass_entities | select('is_state', 'on') | list | count > 0) }}
                  then:
                    - stop: "🛡️ Schalter/Bypass während des Alarms aktiv"

                # ── 3. Alarmrunde ───────────────────────────────────────
                - variables:
                    v_rounds: "{{ v_rounds + 1 }}"
                    v_alarmed: true
                    v_alarm_started: "{{ v_alarm_started if v_alarm_started > 0 else now().timestamp() }}"
                    v_open_min: >-
                      {{ ((now().timestamp() - as_timestamp(states[v_door].last_changed)) / 60) | int }}
                    v_speak: "{{ v_rounds == 1 or v_repeat_enabled == true }}"
                    v_msg: >-
                      {{ (v_msg_first if v_rounds == 1 else v_msg_repeat)
                         | replace('{trigger_name}', v_trig_name)
                         | replace('{room_name}', v_room_name)
                         | replace('{open_minutes}', v_open_min | string) }}

                # 3a. Chime + TTS
                - if:
                    - condition: template
                      value_template: "{{ v_tts_enabled == true and v_speak }}"
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{ v_tts_sleep_disabled }}"
                        - condition: not
                          conditions:
                            - condition: time
                              after: !input tts_sleep_start
                              before: !input tts_sleep_end
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ v_rounds == 1 and v_chime_url != '' }}"
                      then:
                        - action: media_player.play_media
                          target:
                            entity_id: "{{ v_media_players }}"
                          data:
                            media_content_id: "{{ v_chime_url }}"
                            media_content_type: "{{ v_chime_type }}"
                          continue_on_error: true
                        - delay:
                            seconds: "{{ v_chime_wait | int(2) }}"

                    - action: "{{ v_tts_action }}"
                      data: "{{ dict(v_tts_base, message=v_msg) }}"
                      continue_on_error: true

                # 3b. Push
                - if:
                    - condition: template
                      value_template: >-
                        {{ v_speak and v_notify_enabled == true and v_notify_list | count > 0 }}
                    - condition: or
                      conditions:
                        - condition: template
                          value_template: "{{ v_push_sleep_disabled }}"
                        - condition: not
                          conditions:
                            - condition: time
                              after: !input push_sleep_start
                              before: !input push_sleep_end
                  then:
                    - repeat:
                        for_each: "{{ v_notify_list }}"
                        sequence:
                          - action: "{{ repeat.item }}"
                            data:
                              title: >-
                                {{ v_notify_title
                                   | replace('{trigger_name}', v_trig_name)
                                   | replace('{room_name}', v_room_name)
                                   | replace('{open_minutes}', v_open_min | string) }}
                              message: >-
                                {{ v_notify_message
                                   | replace('{trigger_name}', v_trig_name)
                                   | replace('{room_name}', v_room_name)
                                   | replace('{open_minutes}', v_open_min | string) }}
                              data:
                                push:
                                  interruption-level: "{{ v_notify_level }}"
                            continue_on_error: true

                # 3c. Nur in der ersten Runde: Custom Action + Batterie-Check
                - if:
                    - condition: template
                      value_template: "{{ v_rounds == 1 }}"
                  then:
                    - choose: []
                      default: !input action_on_open

                    - if:
                        - condition: template
                          value_template: >-
                            {{ v_battery_warn_enabled == true and v_battery_sensors | list | count > 0 }}
                      then:
                        - delay:
                            seconds: 4

                        - repeat:
                            for_each: "{{ v_battery_sensors if v_battery_sensors is list else [v_battery_sensors] }}"
                            sequence:
                              - variables:
                                  batt_entity: "{{ repeat.item }}"
                                  batt_name: "{{ state_attr(repeat.item, 'friendly_name') | default(repeat.item) }}"
                                  v_batt_triggered: >-
                                    {% if states(batt_entity) not in ['unavailable', 'unknown', ''] %}
                                      {% if batt_entity.startswith('binary_sensor.') %}
                                        {{ states(batt_entity) == 'on' }}
                                      {% else %}
                                        {{ states(batt_entity) | int(100) < v_battery_threshold | int(20) }}
                                      {% endif %}
                                    {% else %}
                                      {{ false }}
                                    {% endif %}
                                  v_batt_level: >-
                                    {% if states(batt_entity) not in ['unavailable', 'unknown', ''] %}
                                      {% if batt_entity.startswith('binary_sensor.') %}
                                        leer (LOWBAT)
                                      {% else %}
                                        {{ states(batt_entity) | int(0) }}%
                                      {% endif %}
                                    {% else %}
                                      unbekannt
                                    {% endif %}

                              - if:
                                  - condition: template
                                    value_template: "{{ v_batt_triggered == true }}"
                                then:

                                  # Batterie-Push
                                  - if:
                                      - condition: template
                                        value_template: >-
                                          {{ v_battery_notify_push == true and v_notify_enabled == true
                                             and v_notify_list | count > 0 }}
                                      - condition: or
                                        conditions:
                                          - condition: template
                                            value_template: "{{ v_push_sleep_disabled }}"
                                          - condition: not
                                            conditions:
                                              - condition: time
                                                after: !input push_sleep_start
                                                before: !input push_sleep_end
                                    then:
                                      - repeat:
                                          for_each: "{{ v_notify_list }}"
                                          sequence:
                                            - action: "{{ repeat.item }}"
                                              data:
                                                title: >-
                                                  {{ v_battery_notify_title
                                                     | replace('{trigger_name}', batt_name)
                                                     | replace('{battery_level}', v_batt_level | string) }}
                                                message: >-
                                                  {{ v_battery_notify_message
                                                     | replace('{trigger_name}', batt_name)
                                                     | replace('{battery_level}', v_batt_level | string) }}
                                                data:
                                                  push:
                                                    interruption-level: "{{ v_battery_interruption_level }}"
                                              continue_on_error: true

                                  # Batterie-TTS (mit Pause für die nächste Entity)
                                  - if:
                                      - condition: template
                                        value_template: "{{ v_battery_notify_tts == true and v_tts_enabled == true }}"
                                      - condition: or
                                        conditions:
                                          - condition: template
                                            value_template: "{{ v_tts_sleep_disabled }}"
                                          - condition: not
                                            conditions:
                                              - condition: time
                                                after: !input tts_sleep_start
                                                before: !input tts_sleep_end
                                    then:
                                      - action: "{{ v_tts_action }}"
                                        data: >-
                                          {{ dict(v_tts_base, message=(v_battery_tts_message
                                                                       | replace('{trigger_name}', batt_name)
                                                                       | replace('{battery_level}', v_batt_level | string))) }}
                                        continue_on_error: true
                                      - delay:
                                          seconds: 4

                # ── 4. Heizung ausschalten? ─────────────────────────────
                # X Runden ODER Y Minuten seit der ersten Ansage – was zuerst kommt.
                - if:
                    - condition: template
                      value_template: >-
                        {{ v_heat_off_enabled == true and v_heating_mode == 'heating'
                           and ((v_heat_off_count | int(0) > 0
                                 and v_rounds >= v_heat_off_count | int(0))
                                or (v_heat_off_minutes | int(0) > 0
                                    and now().timestamp() - v_alarm_started | float(0)
                                        >= v_heat_off_minutes | int(0) * 60)) }}
                  then:
                    - variables:
                        v_turned_off: []

                    - repeat:
                        for_each: "{{ v_room_thermostats }}"
                        sequence:
                          - variables:
                              v_th: "{{ repeat.item }}"
                              v_th_key: "{{ repeat.item.split('.', 1)[1] }}"

                          # Was schon aus ist, bleibt unberührt – so wird ein
                          # Snapshot nie mit "off" überschrieben.
                          - if:
                              - condition: template
                                value_template: "{{ states(v_th) not in ['off', 'unavailable', 'unknown'] }}"
                            then:
                              - action: scene.create
                                data:
                                  scene_id: "tuer_alarm_pro_{{ v_th_key }}"
                                  snapshot_entities: "{{ [v_th] }}"
                                continue_on_error: true

                              # Merker-Helfer: "key=modus:soll;key2=..." (kein JSON,
                              # weil HA JSON beim Rendern in ein Dict umwandeln würde)
                              - if:
                                  - condition: template
                                    value_template: "{{ v_state_helper not in ['', none] }}"
                                then:
                                  - variables:
                                      v_helper_new: >-
                                        {{ (states(v_state_helper).split(';')
                                            | select('search', '=')
                                            | reject('search', '^' ~ v_th_key ~ '=')
                                            | list
                                            + [v_th_key ~ '=' ~ states(v_th) ~ ':'
                                               ~ (state_attr(v_th, 'temperature')
                                                  if state_attr(v_th, 'temperature') is not none else '')])
                                           | join(';') }}
                                  - if:
                                      - condition: template
                                        value_template: >-
                                          {{ v_helper_new | length <= state_attr(v_state_helper, 'max') | int(255) }}
                                    then:
                                      - action: input_text.set_value
                                        target:
                                          entity_id: "{{ v_state_helper }}"
                                        data:
                                          value: "{{ v_helper_new }}"
                                        continue_on_error: true
                                    else:
                                      - action: system_log.write
                                        data:
                                          level: warning
                                          logger: blueprints.tuer_alarm_pro
                                          message: >-
                                            Merker-Helfer {{ v_state_helper }} ist zu kurz für
                                            {{ v_th }} – Wiederherstellung nur über die Szene
                                            (nicht neustartsicher).

                              - action: climate.set_hvac_mode
                                target:
                                  entity_id: "{{ v_th }}"
                                data:
                                  hvac_mode: "off"
                                continue_on_error: true

                              - variables:
                                  v_turned_off: "{{ v_turned_off + [v_th] }}"

                    # Zähler zurücksetzen: schaltet jemand die Heizung bei
                    # offener Tür wieder ein, beginnt ein frischer Zyklus.
                    - variables:
                        v_rounds: 0
                        v_alarm_started: 0
                        v_switched_off: "{{ v_switched_off or v_turned_off | count > 0 }}"

                    # Eine Ansage, dann Ruhe (es wird ja nicht mehr geheizt)
                    - if:
                        - condition: template
                          value_template: "{{ v_turned_off | count > 0 }}"
                      then:
                        - variables:
                            v_msg: >-
                              {{ v_msg_heating_off
                                 | replace('{trigger_name}', v_trig_name)
                                 | replace('{room_name}', v_room_name) }}

                        - if:
                            - condition: template
                              value_template: "{{ v_tts_enabled == true }}"
                            - condition: or
                              conditions:
                                - condition: template
                                  value_template: "{{ v_tts_sleep_disabled }}"
                                - condition: not
                                  conditions:
                                    - condition: time
                                      after: !input tts_sleep_start
                                      before: !input tts_sleep_end
                          then:
                            - action: "{{ v_tts_action }}"
                              data: "{{ dict(v_tts_base, message=v_msg) }}"
                              continue_on_error: true

                        - if:
                            - condition: template
                              value_template: >-
                                {{ v_notify_heating == true and v_notify_enabled == true
                                   and v_notify_list | count > 0 }}
                            - condition: or
                              conditions:
                                - condition: template
                                  value_template: "{{ v_push_sleep_disabled }}"
                                - condition: not
                                  conditions:
                                    - condition: time
                                      after: !input push_sleep_start
                                      before: !input push_sleep_end
                          then:
                            - repeat:
                                for_each: "{{ v_notify_list }}"
                                sequence:
                                  - action: "{{ repeat.item }}"
                                    data:
                                      title: "🔥 Heizung aus: {{ v_room_name }}"
                                      message: "{{ v_msg }}"
                                      data:
                                        push:
                                          interruption-level: "{{ v_notify_level }}"
                                    continue_on_error: true

          # ── 5. Tür zu: Danke-Ansage (nur nach Alarm) ────────────────────
          # Snapshot-Status VOR dem Entprellen merken: der Schließ-Lauf löscht die
          # Szene nach dem Wiederherstellen und spricht dann selbst.
          - variables:
              v_room_has_snapshot: >-
                {{ expand(v_room_thermostats
                          | map('regex_replace', '^climate\\.', 'scene.tuer_alarm_pro_')
                          | list) | count > 0 }}

          - delay:
              seconds: "{{ v_debounce | int(1) }}"

          - if:
              - condition: template
                value_template: "{{ not is_state(v_door, 'off') }}"
            then:
              - stop: "Tür wieder offen – ein neuer Lauf übernimmt"

          - if:
              - condition: template
                value_template: >-
                  {{ v_tts_enabled == true and v_thank_you_mode == 'nur_nach_alarm'
                     and v_alarmed and not v_switched_off and not v_room_has_snapshot }}
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ v_tts_sleep_disabled }}"
                  - condition: not
                    conditions:
                      - condition: time
                        after: !input tts_sleep_start
                        before: !input tts_sleep_end
            then:
              - action: "{{ v_tts_action }}"
                data: >-
                  {{ dict(v_tts_base, message=(v_msg_closed
                                               | replace('{trigger_name}', v_trig_name)
                                               | replace('{room_name}', v_room_name))) }}
                continue_on_error: true

          - stop: "✅ Tür geschlossen – Überwachung beendet"
